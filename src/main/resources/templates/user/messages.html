<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('我的留言')}"></head>
<body>
<div th:replace="~{fragments/navbar :: siteNav('messages')}"></div>

<main class="container page">
    <div class="page-head">
        <div>
            <h1>我的留言</h1>
            <p>共 <strong th:text="${messageCount}">0</strong> 条留言，可以在这里删除不再需要的内容。</p>
        </div>
        <a class="btn btn-brand" th:href="@{/}">去留言</a>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="empty-state" th:if="${#lists.isEmpty(messages)}">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
        </div>
        <h3>你还没有留言</h3>
        <p>去留言墙写下第一条想法吧。</p>
    </div>

    <article class="message-card card" th:each="m : ${messages}">
        <header class="message-head">
            <span th:replace="~{fragments/avatar :: avatar(${currentUser.name}, ${currentUser.avatar}, 'sm')}"></span>
            <div class="message-meta">
                <div class="message-author" th:text="${currentUser.name}">昵称</div>
                <div class="message-sub">
                    <time th:datetime="${m.createdAtIso}" th:text="${m.createdAtText}"
                          th:title="${m.createdAtText}" data-relative-time></time>
                    <span class="dot">·</span>
                    <span class="province-pill"
                          th:text="'来自 ' + ${m.displayProvince}"
                          th:title="${currentAdmin != null ? 'IP ' + m.ip : null}">来自 未知</span>
                </div>
            </div>
        </header>
        <p class="message-content" th:text="${m.content}">留言内容</p>
        <div class="message-actions">
            <form th:action="@{/user/messages/{id}/delete(id=${m.id})}" method="post"
                  data-confirm="确定要删除这条留言吗？删除后无法恢复。">
                <input type="hidden" name="page" th:value="${page.current}">
                <button class="btn btn-ghost-danger btn-sm" type="submit">删除留言</button>
            </form>
        </div>
    </article>

    <div th:replace="~{fragments/pagination :: pagination(${page}, '/user/messages')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
