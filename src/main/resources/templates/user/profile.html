<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('个人中心')}"></head>
<body>
<div th:replace="~{fragments/navbar :: siteNav('profile')}"></div>

<main class="container page">
    <div class="page-head">
        <div>
            <h1>个人中心</h1>
            <p>管理你的头像、资料和留言。</p>
        </div>
        <a class="btn btn-light" th:href="@{/}">返回留言墙</a>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="profile-grid">
        <section class="profile-card card">
            <span th:replace="~{fragments/avatar :: avatar(user.name, user.avatar, 'xl')}"></span>
            <div>
                <div class="profile-name" th:text="${user.name}">昵称</div>
                <span class="badge-role" th:if="${user.admin}">管理员</span>
                <span class="badge-role user" th:unless="${user.admin}">普通用户</span>
            </div>
            <a class="btn btn-light btn-sm" th:href="@{/user/avatar}">更换头像</a>
        </section>

        <section class="profile-detail card">
            <h2 class="section-title">账号资料</h2>
            <div class="detail-row">
                <span>用户 ID</span>
                <strong th:text="${user.id}">1</strong>
            </div>
            <div class="detail-row">
                <span>昵称</span>
                <strong th:text="${user.name}">昵称</strong>
            </div>
            <div class="detail-row">
                <span>邮箱</span>
                <strong th:text="${user.email}">邮箱</strong>
            </div>
            <div class="detail-row">
                <span>留言数</span>
                <strong th:text="${messageCount}">0</strong>
            </div>
            <div class="detail-row">
                <span>密码</span>
                <strong>已加密存储</strong>
            </div>
            <div class="profile-actions">
                <a class="btn btn-brand" th:href="@{/user/profile/edit}">编辑资料</a>
                <a class="btn btn-light" th:href="@{/user/messages}">我的留言</a>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
