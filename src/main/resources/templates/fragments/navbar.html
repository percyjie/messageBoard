<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="siteNav(active)" class="site-header">
    <nav class="container nav-shell">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </span>
            <span class="brand-text">留言板</span>
        </a>

        <div class="nav-actions">
            <a class="nav-link" th:classappend="${active == 'home'} ? 'is-active'" th:href="@{/}">留言墙</a>

            <th:block th:if="${currentUser != null}">
                <a class="nav-link" th:classappend="${active == 'messages'} ? 'is-active'"
                   th:href="@{/user/messages}">我的留言</a>
                <div class="dropdown">
                    <button class="user-chip" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <span th:replace="~{fragments/avatar :: avatar(currentUser.name, currentUser.avatar, 'sm')}"></span>
                        <span class="chip-name" th:text="${currentUser.name}">昵称</span>
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m6 9 6 6 6-6"></path>
                        </svg>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/user/profile}">个人中心</a></li>
                        <li><a class="dropdown-item" th:href="@{/user/profile/edit}">修改资料</a></li>
                        <li><a class="dropdown-item" th:href="@{/user/avatar}">更换头像</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/user/logout}" method="post">
                                <button class="dropdown-item text-danger" type="submit">退出登录</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </th:block>

            <th:block th:if="${currentUser == null}">
                <a class="nav-link" th:href="@{/user/login}">登录</a>
                <a class="btn btn-brand btn-sm" th:href="@{/user/register}">注册</a>
            </th:block>
        </div>
    </nav>
</header>

<header th:fragment="adminNav(active)" class="site-header admin-header">
    <nav class="container nav-shell">
        <a class="brand" th:href="@{/admin/users}">
            <span class="brand-mark admin-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2 4 6v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V6l-8-4z"></path>
                    <path d="m9 12 2 2 4-4"></path>
                </svg>
            </span>
            <span class="brand-text">管理后台</span>
        </a>

        <div class="nav-actions">
            <a class="nav-link" th:classappend="${active == 'users'} ? 'is-active'"
               th:href="@{/admin/users}">用户管理</a>
            <a class="nav-link" th:classappend="${active == 'new'} ? 'is-active'"
               th:href="@{/admin/users/new}">新增管理员</a>
            <a class="nav-link" th:href="@{/}">返回前台</a>
            <span class="admin-chip" th:if="${currentAdmin != null}">
                <span th:replace="~{fragments/avatar :: avatar(currentAdmin.name, currentAdmin.avatar, 'sm')}"></span>
                <span class="chip-name" th:text="${currentAdmin.name}">管理员</span>
            </span>
            <form th:action="@{/admin/logout}" method="post">
                <button class="btn btn-light btn-sm" type="submit">退出管理</button>
            </form>
        </div>
    </nav>
</header>

</body>
</html>
