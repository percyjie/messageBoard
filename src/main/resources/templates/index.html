<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('留言墙')}"></head>
<body>
<div th:replace="~{fragments/navbar :: siteNav('home')}"></div>

<main class="container page">
    <section class="hero">
        <div class="hero-copy">
            <p class="eyebrow">MESSAGE BOARD</p>
            <h1>留下你的想法，<br><span class="gradient-text">让交流发生</span></h1>
            <p class="lead">一个轻量、干净的留言空间。登录后即可发布留言，所有访客都能浏览大家分享的内容。</p>
            <div class="hero-stats">
                <span class="stat-chip"><strong th:text="${messageCount}">0</strong> 条留言</span>
                <span class="stat-chip"><strong th:text="${userCount}">0</strong> 位成员</span>
                <span class="stat-chip"><strong>5</strong> 条 / 页</span>
            </div>
        </div>
        <div class="hero-art" aria-hidden="true">
            <div class="bubble bubble-1">你好，欢迎来留言</div>
            <div class="bubble bubble-2">界面焕新，功能不变</div>
            <div class="bubble bubble-3">今天也要好好写代码</div>
        </div>
    </section>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <section class="composer card" th:if="${currentUser != null}">
        <div class="composer-head">
            <span th:replace="~{fragments/avatar :: avatar(${currentUser.name}, ${currentUser.avatar}, 'md')}"></span>
            <div>
                以 <strong th:text="${currentUser.name}">昵称</strong> 的身份留言
            </div>
        </div>
        <form th:action="@{/messages}" method="post">
            <textarea id="messageContent" name="content" class="form-control" rows="4" maxlength="255"
                      aria-label="留言内容" placeholder="说点什么吧，最多 255 个字符…"
                      th:text="${draftContent}"></textarea>
            <div class="composer-actions">
                <span class="char-count"><span id="charCount">0</span> / 255</span>
                <button class="btn btn-brand" type="submit">发布留言</button>
            </div>
        </form>
    </section>

    <section class="composer card prompt" th:if="${currentUser == null}">
        <div>
            <h2>登录后即可留言</h2>
            <p>注册一个账号，加入这场轻松的交流。</p>
        </div>
        <div class="prompt-actions">
            <a class="btn btn-brand" th:href="@{/user/login}">登录</a>
            <a class="btn btn-light" th:href="@{/user/register}">注册</a>
        </div>
    </section>

    <section class="feed">
        <div class="section-head">
            <h2>最新留言</h2>
            <span class="muted" th:text="'共 ' + ${page.total} + ' 条'">共 0 条</span>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(messages)}">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </div>
            <h3>还没有留言</h3>
            <p>成为第一个在这里留下想法的人吧。</p>
        </div>

        <article class="message-card card" th:each="m : ${messages}">
            <header class="message-head">
                <span th:replace="~{fragments/avatar :: avatar(${m.authorName}, ${m.avatar}, 'md')}"></span>
                <div class="message-meta">
                    <div class="message-author">
                        <span th:text="${m.authorName}">昵称</span>
                        <span class="badge-role" th:if="${m.admin}">管理员</span>
                    </div>
                    <div class="message-sub">
                        <time th:datetime="${m.createdAtIso}" th:text="${m.createdAtText}"
                              th:title="${m.createdAtText}" data-relative-time></time>
                        <span class="dot">·</span>
                        <span class="ip-pill" th:text="'IP ' + ${m.ip}">IP</span>
                    </div>
                </div>
            </header>
            <p class="message-content" th:text="${m.content}">留言内容</p>
        </article>
    </section>

    <div th:replace="~{fragments/pagination :: pagination(${page}, '/')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
