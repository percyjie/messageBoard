<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('留言墙')}"></head>
<body>
<div th:replace="~{fragments/navbar :: siteNav('home')}"></div>

<main class="container page">
    <section class="hero">
        <div class="hero-copy">
            <p class="eyebrow">MESSAGE BOARD</p>
            <h1>留下你的想法，<br><span class="gradient-text">让交流发生</span></h1>
            <p class="lead">一个轻量、干净的留言空间。无需登录也能留言；登录后还能管理个人资料和查看自己的留言。</p>
            <div class="hero-stats">
                <span class="stat-chip"><strong th:text="${messageCount}">0</strong> 条留言</span>
                <span class="stat-chip"><strong th:text="${userCount}">0</strong> 位成员</span>
                <span class="stat-chip"><strong>5</strong> 条 / 页</span>
            </div>
        </div>
        <div class="hero-art" aria-hidden="true">
            <div class="bubble bubble-1">你好，欢迎来留言</div>
            <div class="bubble bubble-2">界面焕新，功能不变</div>
            <div class="bubble bubble-3">今天也要好好写代码</div>
        </div>
    </section>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <section class="composer card">
        <div class="composer-head">
            <th:block th:if="${currentUser != null}">
                <span th:replace="~{fragments/avatar :: avatar(${currentUser.name}, ${currentUser.avatar}, 'md')}"></span>
            </th:block>
            <span th:unless="${currentUser != null}" class="avatar avatar-md"><span>匿</span></span>
            <div>
                <th:block th:if="${currentUser != null}">
                    以 <strong th:text="${currentUser.name}">昵称</strong> 的身份留言
                </th:block>
                <th:block th:unless="${currentUser != null}">
                    以游客身份留言 · <a th:href="@{/user/login}">登录</a> 后显示昵称
                </th:block>
            </div>
            <span class="province-pill composer-location"
                  th:text="'当前归属地：' + ${currentProvince}"
                  th:title="'IP ' + ${currentIp}">当前归属地：未知</span>
        </div>
        <form th:action="@{/messages}" method="post">
            <textarea id="messageContent" name="content" class="form-control" rows="4" maxlength="255"
                      aria-label="留言内容" placeholder="说点什么吧，最多 255 个字符…"
                      th:text="${draftContent}"></textarea>
            <div class="composer-actions">
                <span class="char-count"><span id="charCount">0</span> / 255</span>
                <button class="btn btn-brand" type="submit">发布留言</button>
            </div>
        </form>
    </section>

    <section class="feed">
        <div class="section-head">
            <h2>最新留言</h2>
            <span class="muted" th:text="'共 ' + ${page.total} + ' 条'">共 0 条</span>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(messages)}">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </div>
            <h3>还没有留言</h3>
            <p>成为第一个在这里留下想法的人吧。</p>
        </div>

        <article class="message-card card" th:each="m : ${messages}">
            <header class="message-head">
                <span th:replace="~{fragments/avatar :: avatar(${m.authorName}, ${m.avatar}, 'md')}"></span>
                <div class="message-meta">
                    <div class="message-author">
                        <span th:text="${m.authorName}">昵称</span>
                        <span class="badge-role guest" th:if="${m.anonymous}">游客</span>
                        <span class="badge-role" th:if="${m.admin}">管理员</span>
                    </div>
                    <div class="message-sub">
                        <time th:datetime="${m.createdAtIso}" th:text="${m.createdAtText}"
                              th:title="${m.createdAtText}" data-relative-time></time>
                        <span class="dot">·</span>
                        <span class="province-pill"
                              th:text="'来自 ' + ${m.displayProvince}"
                              th:title="${currentAdmin != null ? 'IP ' + m.ip : null}">来自 未知</span>
                    </div>
                </div>
            </header>
            <p class="message-content" th:text="${m.content}">留言内容</p>
            <div class="message-actions" th:if="${currentAdmin != null}">
                <form th:action="@{/admin/messages/{id}/delete(id=${m.id})}" method="post"
                      data-confirm="确定要删除这条留言吗？删除后无法恢复。">
                    <input type="hidden" name="page" th:value="${page.current}">
                    <button class="btn btn-ghost-danger btn-sm" type="submit">删除留言</button>
                </form>
            </div>
        </article>
    </section>

    <div th:replace="~{fragments/pagination :: pagination(${page}, '/')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
