<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('用户留言')}"></head>
<body>
<div th:replace="~{fragments/navbar :: adminNav('users')}"></div>

<main class="container page">
    <div class="breadcrumb-line">
        <a th:href="@{/admin/users}">用户管理</a>
        <span>/</span>
        <span th:text="${user.name} + ' 的留言'">用户留言</span>
    </div>

    <div class="page-head">
        <div>
            <h1>用户留言</h1>
            <p>查看并删除该用户发布的留言。</p>
        </div>
        <a class="btn btn-light" th:href="@{/admin/users}">返回用户列表</a>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <section class="user-summary card">
        <span th:replace="~{fragments/avatar :: avatar(${user.name}, ${user.avatar}, 'lg')}"></span>
        <div class="user-summary-text">
            <div class="name">
                <span th:text="${user.name}">昵称</span>
                <span class="badge-role" th:if="${user.admin}">管理员</span>
                <span class="badge-role user" th:unless="${user.admin}">普通用户</span>
            </div>
            <div class="muted" th:text="${user.email}">邮箱</div>
            <div class="muted" th:text="'共 ' + ${page.total} + ' 条留言'">共 0 条留言</div>
        </div>
    </section>

    <div class="empty-state" th:if="${#lists.isEmpty(messages)}">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
        </div>
        <h3>该用户还没有留言</h3>
        <p>暂时没有可以管理的内容。</p>
    </div>

    <article class="message-card card" th:each="m : ${messages}">
        <header class="message-head">
            <span th:replace="~{fragments/avatar :: avatar(${user.name}, ${user.avatar}, 'sm')}"></span>
            <div class="message-meta">
                <div class="message-author" th:text="${user.name}">昵称</div>
                <div class="message-sub">
                    <time th:datetime="${m.createdAtIso}" th:text="${m.createdAtText}"
                          th:title="${m.createdAtText}" data-relative-time></time>
                    <span class="dot">·</span>
                    <span class="ip-pill" th:text="'IP ' + ${m.ip}">IP</span>
                </div>
            </div>
        </header>
        <p class="message-content" th:text="${m.content}">留言内容</p>
        <div class="message-actions">
            <form th:action="@{/admin/users/{uid}/messages/{mid}/delete(uid=${user.id}, mid=${m.id})}"
                  method="post" data-confirm="确定要删除这条留言吗？删除后无法恢复。">
                <input type="hidden" name="page" th:value="${page.current}">
                <button class="btn btn-ghost-danger btn-sm" type="submit">删除留言</button>
            </form>
        </div>
    </article>

    <div th:replace="~{fragments/pagination :: pagination(${page}, ${baseUrl})}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
