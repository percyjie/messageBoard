<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/navbar :: adminNav(${navActive})}"></div>

<main class="container page">
    <div class="page-head">
        <div>
            <h1 th:text="${pageTitle}">新增管理员</h1>
            <p th:if="${editing}">
                正在编辑 <strong th:text="${editingUser.name}">用户</strong>
                <span class="muted" th:text="'（ID ' + ${editingUser.id} + '）'"></span>
            </p>
            <p th:unless="${editing}">新账号将拥有管理员权限，可以管理用户和留言。</p>
        </div>
        <a class="btn btn-light" th:href="@{/admin/users}">返回用户列表</a>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <form class="form-card card" th:action="@{${formAction}}" th:object="${adminUserForm}"
          method="post" novalidate>
        <div class="form-field">
            <label class="form-label" for="name">昵称</label>
            <input type="text" id="name" class="form-control" th:field="*{name}" autocomplete="nickname">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="form-field">
            <label class="form-label" for="email">邮箱</label>
            <input type="email" id="email" class="form-control" th:field="*{email}" autocomplete="username">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="form-field">
            <label class="form-label" for="password">密码</label>
            <input type="password" id="password" class="form-control" th:field="*{password}"
                   autocomplete="new-password">
            <p class="form-hint" th:text="${editing} ? '留空表示不修改当前密码；如需修改，请输入 6-20 位新密码。' : '6-20 位，密码会以 BCrypt 加密存储。'">
                密码提示
            </p>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="form-field" th:if="${editing}">
            <label class="form-label">角色</label>
            <div>
                <span class="badge-role" th:if="${editingUser.admin}">管理员</span>
                <span class="badge-role user" th:unless="${editingUser.admin}">普通用户</span>
                <span class="form-hint" style="display:inline; margin-left:8px;">角色暂不支持在此修改</span>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-brand" type="submit"
                    th:text="${editing} ? '保存修改' : '添加管理员'">保存</button>
            <a class="btn btn-light" th:href="@{/admin/users}">取消</a>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
