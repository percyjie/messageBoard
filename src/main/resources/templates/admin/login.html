<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('管理员登录')}"></head>
<body class="auth-body">

<main class="auth-wrap">
    <section class="auth-card card">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark admin-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2 4 6v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V6l-8-4z"></path>
                    <path d="m9 12 2 2 4-4"></path>
                </svg>
            </span>
            <span class="brand-text">留言板</span>
        </a>

        <div class="auth-badge">管理员入口</div>
        <h1>管理后台登录</h1>
        <p class="auth-sub">只有管理员账号可以访问用户与留言管理功能。</p>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form th:action="@{/admin/login}" th:object="${loginForm}" method="post" novalidate>
            <input type="hidden" name="redirect" th:value="${redirect}">

            <div class="form-field">
                <label class="form-label" for="email">邮箱</label>
                <input type="email" id="email" class="form-control" th:field="*{email}"
                       placeholder="admin@example.com" autocomplete="username">
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="form-field">
                <label class="form-label" for="password">密码</label>
                <input type="password" id="password" class="form-control" th:field="*{password}"
                       placeholder="请输入管理员密码" autocomplete="current-password">
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <button class="btn btn-brand w-100" type="submit">登录管理后台</button>
        </form>

        <p class="auth-switch"><a th:href="@{/}">返回留言墙</a></p>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
