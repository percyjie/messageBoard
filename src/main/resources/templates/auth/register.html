<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('注册')}"></head>
<body class="auth-body">

<main class="auth-wrap">
    <section class="auth-card card">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </span>
            <span class="brand-text">留言板</span>
        </a>

        <h1>创建账号</h1>
        <p class="auth-sub">注册成功后会自动登录，马上就能留言。</p>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <form th:action="@{/user/register}" th:object="${registerForm}" method="post" novalidate>
            <div class="form-field">
                <label class="form-label" for="name">昵称</label>
                <input type="text" id="name" class="form-control" th:field="*{name}"
                       placeholder="2-20 个字符" autocomplete="nickname">
                <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>

            <div class="form-field">
                <label class="form-label" for="email">邮箱</label>
                <input type="email" id="email" class="form-control" th:field="*{email}"
                       placeholder="you@example.com" autocomplete="username">
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <div class="form-field">
                <label class="form-label" for="password">密码</label>
                <input type="password" id="password" class="form-control" th:field="*{password}"
                       placeholder="6-20 位" autocomplete="new-password">
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <button class="btn btn-brand w-100" type="submit">注册并登录</button>
        </form>

        <p class="auth-switch">已经有账号？<a th:href="@{/user/login}">直接登录</a></p>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
