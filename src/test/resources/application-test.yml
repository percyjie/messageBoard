spring:
  datasource:
    url: jdbc:h2:mem:messageboard-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema-h2.sql
  thymeleaf:
    cache: false

app:
  page-size: 5
  upload-dir: ./target/test-uploads
  demo-data:
    enabled: true
